<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Vclarity controlled fixture</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f9fb;color:#15171c;font:16px/24px Arial,sans-serif;padding:40px}h1{font-size:28px;font-weight:600;margin:0 0 24px}.workspace{max-width:900px;margin:auto}.card{padding:24px;border:1px solid #e6e8ec;border-radius:12px;background:white;display:flex;gap:16px;align-items:center}.button{display:inline-block;width:160px;height:48px;padding:12px 20px;margin:8px;border:2px solid #365cf5;border-radius:8px;background:#365cf5;color:white;font:600 16px/20px Arial,sans-serif;letter-spacing:.25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.swatch{height:100px}.scroll{overflow:auto;height:100px;margin-top:20px;background:white}.scroll div{height:240px;padding:16px}.transformed{width:100px;height:40px;transform:scale(1.25);transform-origin:top left;background:#16805d;margin-top:30px}input{padding:10px;border:1px solid #e6e8ec;border-radius:6px}#palette{display:flex;width:500px;height:150px;margin-top:40px}#palette>div{width:100px;height:150px}#spacer{height:900px}button{cursor:pointer}
</style></head><body><main class="workspace"><h1>Workspace settings</h1><section class="card" aria-label="Profile"><div><strong>Team workspace</strong><p>Manage your product workspace.</p><button id="known-button" class="button" onclick="window.fixtureClicks++">Save changes</button></div><form onsubmit="window.fixtureSubmits++;return false"><label for="email">Work email</label><input id="email" type="email" placeholder="name@example.com"><button disabled>Invite member</button><input type="password" value="do-not-collect"></form></section><section class="grid"><div class="swatch" style="background:#365cf5"></div><div class="swatch" style="background:#16805d"></div><div class="swatch" style="background:#b86b16"></div></section><div id="shadow-host"></div><div class="transformed" id="transformed">Transformed</div><div class="scroll"><div>Scrollable content</div></div><div id="palette"><div style="background:#ff0000"></div><div style="background:#00ff00"></div><div style="background:#0000ff"></div><div style="background:#ffffff"></div><div style="background:#000000"></div></div><iframe title="Frame boundary" srcdoc="<button>Frame content</button>" style="height:70px;margin-top:20px"></iframe><div id="spacer"></div></main><script>window.fixtureClicks=0;window.fixtureSubmits=0;const root=document.querySelector('#shadow-host').attachShadow({mode:'open'});root.innerHTML='<style>button{font:14px Arial;padding:8px;background:#eef2ff;border:1px solid #365cf5;border-radius:4px;margin-top:20px}</style><button id="shadow-button">Shadow action</button>';</script></body></html>
